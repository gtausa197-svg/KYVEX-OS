<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2560" height="1440" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#090a10"/>
      <stop offset=".66" stop-color="#121022"/>
      <stop offset="1" stop-color="#0b0c15"/>
    </linearGradient>
    <radialGradient id="violet">
      <stop stop-color="#664cb1" stop-opacity=".32"/>
      <stop offset="1" stop-color="#664cb1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop stop-color="#288899" stop-opacity=".30"/>
      <stop offset="1" stop-color="#288899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#f16bac"/>
      <stop offset=".48" stop-color="#b09aff"/>
      <stop offset="1" stop-color="#69ece1"/>
    </linearGradient>
    <filter id="glow" x="-.12" y="-.8" width="1.24" height="2.6">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <path id="ribbon" d="M-70 792C224 753 377 617 579 693S1091 921 1665 564"/>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>
  <ellipse cx="415" cy="664" rx="652" ry="380" fill="url(#violet)"/>
  <ellipse cx="1420" cy="687" rx="580" ry="342" fill="url(#cyan)"/>
  <g fill="none" stroke="url(#aurora)">
    <use xlink:href="#ribbon" stroke-width="56" opacity=".28" filter="url(#glow)"/>
    <use xlink:href="#ribbon" stroke-width="2" opacity=".65"/>
    <use xlink:href="#ribbon" transform="translate(0 18)" stroke-width="1" opacity=".33"/>
  </g>

  <g fill="none" stroke="#baa4f6" stroke-opacity=".15">
    <ellipse cx="800" cy="579" rx="186" ry="63" transform="rotate(-15 800 579)"/>
    <circle cx="800" cy="579" r="78"/>
  </g>
  <image x="748" y="518" width="104" height="124" xlink:href="kyvex.svg"/>
  <text x="804" y="688" fill="#f1ebff" font-family="DejaVu Sans"
        font-size="21" font-weight="bold" letter-spacing="8" text-anchor="middle">KYVEX OS</text>
</svg>
